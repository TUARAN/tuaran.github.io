<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Redirecting to 2aran.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://2aran.com/">
<meta http-equiv="refresh" content="0; url=https://2aran.com/">
<script>
  (function () {
    var target = "https://2aran.com" + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #ddd; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.25rem; text-align: center; }
  a { color: #6cb6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-weight: 400; font-size: 1.15rem; margin: 0 0 0.75rem; }
  p { font-size: 0.9rem; opacity: 0.7; margin: 0; }
</style>
</head>
<body>
  <div>
    <h1>正在跳转到 <a href="https://2aran.com/">2aran.com</a> …</h1>
    <p>没自动跳转？<a href="https://2aran.com/">点这里</a></p>
  </div>
</body>
</html>
